[project]
name = "ui-tree-monitor"
version = "0.1.0"
description = "Windows 应用 UI 结构树数值/属性变化监控工具（基于 UIA，免底层协议）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uiautomation>=2.0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
